  <!-- Same mark as /logo.svg, but with a large intrinsic size. MetallicPaint
       rasterises whatever the browser hands it and upscales anything under
       500px, so the 41px original arrives blurred and the alpha mask — which
       is what the shader cuts the metal to — loses its edges. -->
