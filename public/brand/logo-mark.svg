  <path d="M20 40C31.0457 40 40 31.0457 40 20C28.9543 20 20 28.9543 20 40Z" fill="#8a8a8a"/>
  <path d="M20 0C31.0457 0 40 8.9543 40 20C28.9543 20 20 11.0457 20 0Z" fill="#141414"/>
  <path d="M20 40C8.9543 40 0 31.0457 0 20C11.0457 20 20 28.9543 20 40Z" fill="#141414"/>
</svg>
