name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run's answer irrelevant — cancel it rather
# than paying for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly, which is
      # the point: a drifted lockfile should fail here, not in a deploy.
      - run: npm ci

      # Convex's generated types are gitignored in most setups; ours are
      # committed, so typecheck can run without a deployment.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src
